<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AutoResolve</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="glass-panel login-panel">
      <div class="logo-box" style="justify-content: center; margin-bottom: 2rem;">
        <h1 style="text-align: center;">AutoResolve</h1>
      </div>
      <p class="subtitle" style="text-align: center; margin-bottom: 2rem;">Ticketing System Authentication</p>
      <div style="display: flex; flex-direction: column; gap: 1rem;">
        <button id="btn-customer" class="glow-button" style="background: linear-gradient(135deg, #1e293b, #0f172a);">
          Access as Customer
        </button>
        <button id="btn-admin" class="glow-button" style="background: linear-gradient(135deg, #be123c, #881337);">
          Access as Agent
        </button>
        <div id="admin-pass-container" style="display: none; flex-direction: column; gap: 0.5rem;">
          <input type="password" id="admin-password" placeholder="Password" style="padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none;">
          <button id="btn-admin-login" class="glow-button" style="background: linear-gradient(135deg, #ea580c, #c2410c);">
            Verify
          </button>
        </div>
      </div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
